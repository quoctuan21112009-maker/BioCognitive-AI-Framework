# BioCognitive-AI Framework v4
# Python Project Configuration

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-agent-v4"
version = "4.0.0"
description = "BioCognitive AI Framework v4 - Cognitive Graph Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BioCognitive Team", email = "quoctuan21112009@gmail.com"}
]
keywords = ["ai", "cognitive", "neuroscience", "architecture", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/quoctuan21112009-maker/BioCognitive-AI-Framework"
Documentation = "https://github.com/quoctuan21112009-maker/BioCognitive-AI-Framework/tree/main/docs"
Repository = "https://github.com/quoctuan21112009-maker/BioCognitive-AI-Framework.git"
Issues = "https://github.com/quoctuan21112009-maker/BioCognitive-AI-Framework/issues"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
(
  # directories
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["bio_agent_v4"]
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["bio_agent_v4/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests (skip with -m 'not slow')",
]

[tool.coverage.run]
branch = true
source = ["bio_agent_v4"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

